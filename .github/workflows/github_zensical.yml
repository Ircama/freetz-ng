name: github_zensical

on:
  workflow_run:
    workflows: [ postcommit_docs,postcommit_stats,avm_ftp,avm_osp,avm_juis,avm_juis-recache ]
    types:
      - completed
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/github_zensical.yml'
      - 'docs/zensical.*'
      - 'docs/extra.css'
      - 'docs/*.md'
      - 'docs/fix-page-languages.sh'
      - 'docs/screenshots/evo-demo.html'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'freetz-ng/freetz-ng' || github.repository == 'ircama/freetz-evo' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: python3 -m pip install --upgrade "zensical"
      - name: Show renderer versions
        run: python3 -m pip show Markdown zensical pymdown-extensions Pygments
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build with Zensical
        run: zensical build --config-file "./docs/zensical.toml"
      - name: Set per-page language hints
        run: bash docs/fix-page-languages.sh "./docs/site"
      - name: Verify page language hints
        run: |
          NEWS_HTML="./docs/site/NEWS/index.html"
          ENGLISH_HTML="./docs/site/REPO_README/index.html"
          test -f "$NEWS_HTML"
          test -f "$ENGLISH_HTML"
          grep -q '<html lang="de" class="no-js">' "$NEWS_HTML"
          grep -q 'http-equiv="content-language" content="de"' "$NEWS_HTML"
          grep -q 'name="DC.language" content="de"' "$NEWS_HTML"
          grep -q 'property="og:locale" content="de_DE"' "$NEWS_HTML"
          grep -q 'rel="alternate" hreflang="de"' "$NEWS_HTML"
          grep -q '"@context":"https://schema.org"' "$NEWS_HTML"
          grep -q '"@type":"WebPage"' "$NEWS_HTML"
          grep -q '"name":"Upstream Freetz-NG News"' "$NEWS_HTML"
          grep -q '"inLanguage":"de-DE"' "$NEWS_HTML"
          grep -q '<article class="md-content__inner md-typeset" lang="de" translate="yes">' "$NEWS_HTML"
          grep -q '<h1 id="upstream-freetz-ng-news" lang="en" translate="no">Upstream Freetz-NG News' "$NEWS_HTML"
          grep -q '<title>Upstream Freetz-NG News - Freetz-EVO Documentation</title>' "$NEWS_HTML"
          if grep -Eq '^[[:space:]]*Neuigkeiten[[:space:]]*$' "$NEWS_HTML"; then
            echo "Detected stale NEWS index label"
            exit 1
          fi
          grep -q 'not Freetz-EVO release notes' "$NEWS_HTML"
          grep -q 'ircama-github-io.translate.goog/freetz-evo/NEWS/' "$NEWS_HTML"
          grep -q '<header class="md-header md-header--shadow notranslate" data-md-component="header" lang="en" translate="no">' "$NEWS_HTML"
          grep -q '<a class="headerlink notranslate"' "$NEWS_HTML"
          perl -0ne 'exit((/<a href="[^\"]*NEWS\/" class="md-nav__link">.*?<span class="md-ellipsis">\s*Upstream Freetz-NG News\s*<\/span>/s)?0:1)' "$ENGLISH_HTML"
          grep -q '<html lang="en" class="no-js">' "$ENGLISH_HTML"
      - name: Verify syntax highlighting markup
        run: |
          TARGET_HTML="./docs/site/GETTING_STARTED/index.html"
          test -f "$TARGET_HTML"
          grep -q '<div class="language-bash highlight">' "$TARGET_HTML"
          if grep -q '<pre><code class="language-bash">' "$TARGET_HTML"; then
            echo "Detected non-tokenized bash fences in $TARGET_HTML"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs/site/"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
